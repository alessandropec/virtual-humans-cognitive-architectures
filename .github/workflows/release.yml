name: Student package release
on:
  push:
    tags: ['*-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package this release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, pathlib, zipfile
          tag = os.environ['RELEASE_TAG']
          catalogue = json.loads(pathlib.Path('catalogue.json').read_text())
          package = next(p for p in catalogue['packages'].values() if p['tag'] == tag)
          folder = pathlib.Path(package['destination'])
          with zipfile.ZipFile('package.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for file in sorted(folder.rglob('*')):
                  if file.is_file():
                      archive.write(file, file.as_posix())
          pathlib.Path('release-notes.md').write_text(package['title'] + '\n\nVersion ' + package['version'] + '\n')
          PY
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" package.zip --title "$RELEASE_TAG" --notes-file release-notes.md

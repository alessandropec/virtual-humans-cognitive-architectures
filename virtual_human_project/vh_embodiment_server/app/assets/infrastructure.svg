<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
  <title id="title">Virtual Human project infrastructure</title>
  <desc id="desc">The browser sends microphone audio through Whisper STT, or typed text directly, to the embodiment server. The cognitive architecture server processes text using an LLM provider and returns reply JSON. Piper TTS generates speech and the browser displays the avatar behaviour.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247a82"/></marker>
    <style>
      text{font-family:system-ui,sans-serif;fill:#233446;font-size:13px}
      .heading{font-size:16px;font-weight:700}.label{font-size:12px}.small{font-size:11px;fill:#506577}
      .server{fill:#edf5fa;stroke:#7597aa;stroke-width:1.5}.module{fill:white;stroke:#b6cbd7}.flow{fill:none;stroke:#247a82;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1000" height="550" rx="16" fill="#f6f8fa"/>
  <rect class="server" x="20" y="80" width="195" height="420" rx="12"/>
  <text class="heading" x="40" y="112">Browser</text>
  <text class="small" x="40" y="133">Avatar, chat, API Playground</text>
  <rect class="module" x="40" y="155" width="155" height="45" rx="7"/>
  <text x="55" y="183">Microphone audio</text>
  <rect class="module" x="40" y="230" width="155" height="45" rx="7"/>
  <text x="55" y="258">Typed text</text>
  <rect class="module" x="40" y="415" width="155" height="60" rx="7"/>
  <text x="55" y="440">3D avatar + audio</text>
  <text class="small" x="55" y="460">Lip-sync and whiteboard</text>

  <rect class="server" x="275" y="20" width="345" height="510" rx="12"/>
  <text class="heading" x="295" y="52">VH Embodiment Server</text>
  <text class="small" x="295" y="72">Local speech + avatar API · port 8899</text>
  <rect class="module" x="300" y="145" width="295" height="62" rx="7"/>
  <text class="heading" x="315" y="171">STT · Whisper</text>
  <text class="label" x="315" y="192">Speech to text · English or Italian</text>
  <rect class="module" x="300" y="232" width="295" height="44" rx="7"/>
  <text x="315" y="259">Text request</text>
  <rect class="module" x="300" y="320" width="295" height="45" rx="7"/>
  <text x="315" y="348">Reply JSON</text>
  <rect class="module" x="300" y="410" width="138" height="85" rx="7"/>
  <text class="heading" x="313" y="435">TTS · Piper</text>
  <text class="label" x="313" y="458">Text to speech</text>
  <text class="small" x="313" y="479">EN / IT · F / M</text>
  <rect class="module" x="452" y="410" width="143" height="85" rx="7"/>
  <text class="heading" x="465" y="435">Behaviour</text>
  <text class="small" x="465" y="455">Emotion · expression</text>
  <text class="small" x="465" y="471">One gesture</text>

  <rect class="server" x="700" y="130" width="280" height="165" rx="12"/>
  <text class="heading" x="718" y="157">VH Cognitive</text>
  <text class="heading" x="718" y="178">Architecture Server</text>
  <text class="small" x="718" y="199">Agent logic · port 8000</text>
  <text x="718" y="230">Process text and build the prompt</text>
  <text x="718" y="254">Parse the response into reply JSON</text>
  <text class="small" x="718" y="278">Basic text / structured course examples</text>
  <rect class="server" x="700" y="405" width="280" height="90" rx="12"/>
  <text class="heading" x="720" y="437">LLM provider</text>
  <text x="720" y="462">Ollama Cloud in the basic examples</text>
  <text class="small" x="720" y="482">Your own provider API key</text>

  <path class="flow" d="M195 177H300"/>
  <path class="flow" d="M195 252H300"/>
  <path class="flow" d="M447 207V232"/>
  <path class="flow" d="M595 246H700"/>
  <text class="small" x="626" y="226">POST /agent</text>
  <text class="small" x="631" y="240">{text}</text>
  <path class="flow" d="M700 275H660V342H595"/>
  <text class="small" x="670" y="318">Reply JSON</text>
  <path class="flow" d="M760 295V405"/>
  <text class="label" x="708" y="354">Prompt</text>
  <path class="flow" d="M920 405V295"/>
  <text class="label" x="842" y="354">LLM response</text>
  <path class="flow" d="M369 365V410"/>
  <text class="small" x="303" y="393">speech_text</text>
  <path class="flow" d="M524 365V410"/>
  <path class="flow" d="M300 438H195"/>
  <text class="small" x="225" y="427">Audio</text>
  <path class="flow" d="M524 495V517H117V475"/>
  <text class="small" x="150" y="511">Behaviour, image and lip-sync playback in the browser</text>
</svg>
